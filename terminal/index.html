<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terminal version of Jose Luis Rodríguez's portfolio.">
  <meta name="theme-color" content="#171923">
  <title>JLRE — Terminal Portfolio</title>
  <link rel="stylesheet" href="terminal.css">
  <script src="terminal.js" defer></script>
</head>
<body>
  <main class="terminal-shell" aria-label="Interactive terminal portfolio">
    <header class="terminal-bar">
      <div class="terminal-brand"><span class="brand-mark">JLRE</span><span class="brand-divider">/</span><span class="terminal-label" data-i18n="bar">PORTFOLIO TERMINAL</span></div>
      <div class="terminal-controls">
        <button type="button" id="language-control" aria-label="Change language">EN</button>
        <button type="button" id="theme-control" aria-label="Change theme">LIGHT</button>
        <a href="../index.html" class="gui-link" data-i18n="gui">GUI VERSION <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <section class="terminal-screen" aria-label="Terminal session">
      <div id="terminal-output" class="terminal-output" aria-live="polite" aria-relevant="additions text"></div>
      <form id="terminal-form" class="terminal-form" autocomplete="off">
        <label class="prompt" for="terminal-input"><span class="prompt-user">jose@portfolio</span><span class="prompt-path">:~</span><span class="prompt-mark">$</span></label>
        <input id="terminal-input" name="command" type="text" spellcheck="false" autocapitalize="off" aria-label="Enter a portfolio command">
        <span class="input-cursor" aria-hidden="true"></span>
      </form>
      <p id="terminal-status" class="sr-only" aria-live="assertive"></p>
    </section>

    <footer class="terminal-footer">
      <span data-i18n="foot">HTML / CSS / JAVASCRIPT</span>
      <span>JOSE LUIS RODRÍGUEZ <span class="footer-separator">/</span> 2026</span>
      <span class="inspiration-note"><span data-i18n="inspiration">Thanks to Noah Kim for the inspiration:</span> <a href="https://terminal.boatnoah.com/" target="_blank" rel="noopener noreferrer">terminal.boatnoah.com</a></span>
    </footer>
  </main>
</body>
</html>
